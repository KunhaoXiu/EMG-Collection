<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多模态生物力学信号采集系统</title>
    <link rel="stylesheet" href="./styles/main.css">
    <style>
        /* ---------- 顶部控制区按钮 ---------- */
        .header-card .btn-primary,
        .header-card .btn-secondary,
        .header-card .btn-danger {
            font-size: clamp(0.7rem, 0.85vw, 0.95rem);
            padding: clamp(5px, 0.5vw, 8px) clamp(8px, 1vw, 14px);
            min-width: clamp(56px, 5.5vw, 88px);
            min-height: clamp(26px, 2.2vw, 36px);
            border-radius: clamp(4px, 0.35vw, 6px);
            line-height: 1.2;
            white-space: nowrap;
            flex: 0 1 auto;
            transition: all 0.2s ease;
        }
        .btn-icon {
            width: clamp(22px, 2vw, 30px);
            height: clamp(22px, 2vw, 30px);
            aspect-ratio: 1 / 1;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.65rem, 0.9vw, 0.9rem);
            border-radius: clamp(3px, 0.3vw, 5px);
            flex-shrink: 0;
        }
        .splash-enter-btn {
            font-size: clamp(0.9rem, 1.8vw, 1.3rem);
            padding: clamp(8px, 1.2vw, 14px) clamp(20px, 3.5vw, 40px);
            min-height: clamp(36px, 3.5vw, 52px);
            border-radius: clamp(6px, 0.8vw, 10px);
            line-height: 1.2;
        }
        .splash-theme-btn {
            font-size: clamp(0.7rem, 1vw, 0.9rem);
            padding: clamp(4px, 0.5vw, 6px) clamp(8px, 1vw, 12px);
            min-height: clamp(24px, 2vw, 32px);
            border-radius: clamp(4px, 0.4vw, 6px);
        }
        .conn-buttons { gap: clamp(4px, 0.4vw, 8px); }
        .data-buttons { gap: clamp(4px, 0.4vw, 8px); }
        .status-dot {
            width: clamp(8px, 0.8vw, 12px);
            height: clamp(8px, 0.8vw, 12px);
        }
        .duration-box {
            font-size: clamp(0.65rem, 0.75vw, 0.8rem);
            padding: clamp(2px, 0.3vw, 4px) clamp(4px, 0.5vw, 8px);
        }
        .duration-value {
            font-size: clamp(0.75rem, 0.9vw, 1rem);
            min-width: clamp(60px, 6vw, 80px);
        }
        .modal-header .btn-secondary {
            font-size: clamp(0.75rem, 0.9vw, 0.95rem);
            padding: clamp(4px, 0.5vw, 6px) clamp(8px, 1vw, 12px);
            min-height: clamp(24px, 2vw, 32px);
            border-radius: clamp(4px, 0.35vw, 6px);
        }

        /* ==================== EMG 通道颜色 ==================== */
        .emg1-color { color: #f87171; }  .emg1-dot { background: #ef4444; }
        .emg2-color { color: #fb923c; }  .emg2-dot { background: #f97316; }
        .emg3-color { color: #fbbf24; }  .emg3-dot { background: #f59e0b; }
        .emg4-color { color: #4ade80; }  .emg4-dot { background: #22c55e; }
        .emg5-color { color: #2dd4bf; }  .emg5-dot { background: #14b8a6; }
        .emg6-color { color: #38bdf8; }  .emg6-dot { background: #0ea5e9; }
        .emg7-color { color: #a78bfa; }  .emg7-dot { background: #8b5cf6; }
        .emg8-color { color: #f472b6; }  .emg8-dot { background: #ec4899; }
        .imu-color  { color: #4ade80; }  .imu-dot  { background: #22c55e; }

        /* ==================== 肌电波形面板 ==================== */

    </style>
</head>
<body class="splash-active">

    <!-- ==================== 启动页 ==================== -->
    <div id="splash-screen" class="splash-screen" aria-hidden="true">
        <button id="splash-theme-btn" class="splash-theme-btn" type="button" onclick="toggleTheme()">浅色模式</button>
        <img class="splash-logo" src="./logo/河北工业大学-logo.svg" alt="河北工业大学校徽">
        <div class="splash-title">多模态生物力学信号采集系统</div>
        <div class="splash-subtitle">BIMS – Biomechanical Inertial and Myoelectric System</div>
        <button id="enter-app-btn" class="splash-enter-btn" type="button">点击进入系统</button>
    </div>

    <!-- ==================== 放大模态框 ==================== -->
    <div id="zoom-modal" class="modal-overlay">
        <div class="modal-header">
            <span class="modal-title" id="zoom-title">图表放大</span>
            <button class="btn-secondary" onclick="closeZoom()">✕ 关闭</button>
        </div>
        <canvas id="zoom-canvas" class="modal-canvas"></canvas>
        <div id="zoom-data-grid" class="zoom-data-grid"></div>
    </div>

    <!-- ==================== 主容器 ==================== -->
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-top">
                <div class="header-brand">
                    <img class="school-logo" src="./logo/河北工业大学-logo.svg" alt="河北工业大学校徽">
                    <h1>多模态生物力学信号采集系统</h1>
                </div>
                <div class="header-top-right">
                    <div class="status-pill">
                        <div class="status-dot" id="conn-dot"></div>
                        <span id="conn-text">未连接</span>
                    </div>
                    <button class="btn-secondary" id="btn-theme" onclick="toggleTheme()">浅色模式</button>
                </div>
            </div>

            <div class="header-cards">
                <div class="header-card header-card-conn">
                    <div class="header-card-title">连接控制</div>
                    <select id="serial-port-select" class="serial-port-select" title="串口选择"></select>
                    <div class="conn-buttons">
                        <button class="btn-secondary" id="btn-refresh-ports" onclick="serial.refreshPorts()">刷新串口</button>
                        <button class="btn-primary" id="btn-connect" onclick="serial.connect()">连接串口</button>
                        <button class="btn-danger" id="btn-disconnect" onclick="serial.disconnect()" disabled>断开</button>
                    </div>
                </div>
                <div class="header-card header-card-metrics">
                    <div class="header-card-title">实时指标</div>
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <span class="metric-label">帧率</span>
                            <div class="metric-value"><span id="fps">0</span><small>Hz</small></div>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">总帧</span>
                            <div class="metric-value"><span id="total-frames">0</span></div>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">已录</span>
                            <div class="metric-value"><span id="recorded-frames">0</span></div>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">错误</span>
                            <div class="metric-value"><span id="err-lines">0</span></div>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">缓存</span>
                            <div class="metric-value"><span id="buf-size">0</span></div>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">连接时长</span>
                            <div class="metric-value"><span id="conn-duration">00:00:00</span></div>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">采集时长</span>
                            <div class="metric-value"><span id="acq-duration">00:00:00</span></div>
                        </div>
                    </div>
                </div>
                <div class="header-card header-card-data">
                    <div class="header-card-title">数据操作</div>
                    <div class="data-buttons">
                        <button class="btn-primary" onclick="toggleCollect()" id="btn-collect" disabled>开始采集</button>
                        <button class="btn-secondary" onclick="togglePause()" id="btn-pause">暂停</button>
                        <button class="btn-secondary" onclick="exportCSV()">导出CSV</button>
                        <button class="btn-secondary" onclick="clearData()">清空数据</button>
                        <button class="btn-secondary" onclick="clearLogs()">清日志</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- ==================== 第一行: EMG 通道 1-4 ==================== -->
        <div class="row row-emg">
            <div class="panel emg-panel">
                <div class="panel-header">
                    <div class="panel-title emg1-color"><span class="dot emg1-dot"></span>EMG CH1</div>
                    <button class="btn-icon" onclick="openZoom('emg', 0)" title="放大">🔍</button>
                </div>
                <canvas id="canvas-emg-0"></canvas>
                <div class="data-grid emg-grid-vals" id="vals-emg-0"></div>
            </div>
            <div class="panel emg-panel">
                <div class="panel-header">
                    <div class="panel-title emg2-color"><span class="dot emg2-dot"></span>EMG CH2</div>
                    <button class="btn-icon" onclick="openZoom('emg', 1)" title="放大">🔍</button>
                </div>
                <canvas id="canvas-emg-1"></canvas>
                <div class="data-grid emg-grid-vals" id="vals-emg-1"></div>
            </div>
            <div class="panel emg-panel">
                <div class="panel-header">
                    <div class="panel-title emg3-color"><span class="dot emg3-dot"></span>EMG CH3</div>
                    <button class="btn-icon" onclick="openZoom('emg', 2)" title="放大">🔍</button>
                </div>
                <canvas id="canvas-emg-2"></canvas>
                <div class="data-grid emg-grid-vals" id="vals-emg-2"></div>
            </div>
            <div class="panel emg-panel">
                <div class="panel-header">
                    <div class="panel-title emg4-color"><span class="dot emg4-dot"></span>EMG CH4</div>
                    <button class="btn-icon" onclick="openZoom('emg', 3)" title="放大">🔍</button>
                </div>
                <canvas id="canvas-emg-3"></canvas>
                <div class="data-grid emg-grid-vals" id="vals-emg-3"></div>
            </div>
        </div>

        <!-- ==================== 第二行: EMG 通道 5-8 ==================== -->
        <div class="row row-emg">
            <div class="panel emg-panel">
                <div class="panel-header">
                    <div class="panel-title emg5-color"><span class="dot emg5-dot"></span>EMG CH5</div>
                    <button class="btn-icon" onclick="openZoom('emg', 4)" title="放大">🔍</button>
                </div>
                <canvas id="canvas-emg-4"></canvas>
                <div class="data-grid emg-grid-vals" id="vals-emg-4"></div>
            </div>
            <div class="panel emg-panel">
                <div class="panel-header">
                    <div class="panel-title emg6-color"><span class="dot emg6-dot"></span>EMG CH6</div>
                    <button class="btn-icon" onclick="openZoom('emg', 5)" title="放大">🔍</button>
                </div>
                <canvas id="canvas-emg-5"></canvas>
                <div class="data-grid emg-grid-vals" id="vals-emg-5"></div>
            </div>
            <div class="panel emg-panel">
                <div class="panel-header">
                    <div class="panel-title emg7-color"><span class="dot emg7-dot"></span>EMG CH7</div>
                    <button class="btn-icon" onclick="openZoom('emg', 6)" title="放大">🔍</button>
                </div>
                <canvas id="canvas-emg-6"></canvas>
                <div class="data-grid emg-grid-vals" id="vals-emg-6"></div>
            </div>
            <div class="panel emg-panel">
                <div class="panel-header">
                    <div class="panel-title emg8-color"><span class="dot emg8-dot"></span>EMG CH8</div>
                    <button class="btn-icon" onclick="openZoom('emg', 7)" title="放大">🔍</button>
                </div>
                <canvas id="canvas-emg-7"></canvas>
                <div class="data-grid emg-grid-vals" id="vals-emg-7"></div>
            </div>
        </div>

        <!-- ==================== 第三行: IMU + RMS 柱状图 ==================== -->
        <div class="row row-imu">
            <div class="panel imu-panel">
                <div class="panel-header">
                    <div class="panel-title imu-color"><span class="dot imu-dot"></span>IMU 传感器 (6通道)</div>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <button class="btn-icon" onclick="openZoom('imu', 0)" title="放大">🔍</button>
                    </div>
                </div>
                <canvas id="canvas-imu"></canvas>
                <div class="data-grid imu-grid-vals" id="vals-imu"></div>
            </div>
        </div>

        <!-- ==================== 第四行: 日志 ==================== -->
        <div class="row row-logs">
            <div class="panel" style="max-height:180px">
                <div class="panel-header">
                    <span style="color:#4ade80">📥 实时接收数据</span>
                    <span id="data-log-count" style="font-size:0.7rem;color:#475569">0 条</span>
                </div>
                <div class="log-container" id="logData"></div>
            </div>
            <div class="panel" style="max-height:180px">
                <div class="panel-header">
                    <span style="color:#94a3b8">🔧 调试信息</span>
                    <span id="debug-log-count" style="font-size:0.7rem;color:#475569">0 条</span>
                </div>
                <div class="log-container" id="logDebug"></div>
            </div>
        </div>
    </div>


    <script src="./scripts/app.js"></script>
</body>
</html>
