<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多模态生物力学信号采集系统</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body class="splash-active">

    <!-- ==================== 启动页 ==================== -->
    <div id="splash-screen" class="splash-screen" aria-hidden="true">
        <button id="splash-theme-btn" class="splash-theme-btn" type="button" onclick="toggleTheme()">浅色模式</button>
        <img class="splash-logo" src="./logo/河北工业大学-logo.svg" alt="河北工业大学校徽">
        <div class="splash-title">多模态生物力学信号采集系统</div>
        <div class="splash-subtitle">BIMS – Biomechanical Inertial and Myoelectric System</div>
        <button id="enter-app-btn" class="splash-enter-btn" type="button">点击进入系统</button>
    </div>

    <!-- ==================== 放大模态框 ==================== -->
    <div id="zoom-modal" class="modal-overlay">
        <div class="modal-header">
            <span class="modal-title" id="zoom-title">图表放大</span>
            <button class="btn-secondary" onclick="closeZoom()">✕ 关闭</button>
        </div>
        <canvas id="zoom-canvas" class="modal-canvas"></canvas>
        <div id="zoom-data-grid" class="zoom-data-grid"></div>
    </div>

    <!-- ==================== 主容器 ==================== -->
    <div class="container">
        <header>
            <div class="header-top">
                <div class="header-brand">
                    <img class="school-logo" src="./logo/河北工业大学-logo.svg" alt="河北工业大学校徽">
                    <h1>多模态生物力学信号采集系统</h1>
                </div>
                <div class="header-top-right">
                    <div class="status-pill">
                        <div class="status-dot" id="conn-dot"></div>
                        <span id="conn-text">未连接</span>
                    </div>
                    <button class="btn-secondary" id="btn-theme" onclick="toggleTheme()">浅色模式</button>
                </div>
            </div>

            <div class="header-cards">
                <div class="header-card header-card-conn">
                    <div class="header-card-title">连接控制</div>
                    <select id="serial-port-select" class="serial-port-select" title="串口选择"></select>
                    <div class="conn-buttons">
                        <button class="btn-secondary" id="btn-refresh-ports" onclick="serial.refreshPorts()">刷新串口</button>
                        <button class="btn-primary" id="btn-connect" onclick="serial.connect()">连接串口</button>
                        <button class="btn-danger" id="btn-disconnect" onclick="serial.disconnect()" disabled>断开</button>
                    </div>
                </div>
                <div class="header-card header-card-metrics">
                    <div class="header-card-title">实时指标</div>
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <span class="metric-label">帧率</span>
                            <div class="metric-value"><span id="fps">0</span><small>Hz</small></div>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">总帧</span>
                            <div class="metric-value"><span id="total-frames">0</span></div>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">已录</span>
                            <div class="metric-value"><span id="recorded-frames">0</span></div>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">错误</span>
                            <div class="metric-value"><span id="err-lines">0</span></div>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">缓存</span>
                            <div class="metric-value"><span id="buf-size">0</span></div>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">连接时长</span>
                            <div class="metric-value"><span id="conn-duration">00:00:00</span></div>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">采集时长</span>
                            <div class="metric-value"><span id="acq-duration">00:00:00</span></div>
                        </div>
                    </div>
                </div>
                <div class="header-card header-card-data">
                    <div class="header-card-title">数据操作</div>
                    <div class="data-buttons">
                        <button class="btn-primary" onclick="toggleCollect()" id="btn-collect" disabled>开始采集</button>
                        <button class="btn-secondary" onclick="togglePause()" id="btn-pause">暂停</button>
                        <button class="btn-secondary" onclick="exportCSV()">导出CSV</button>
                        <button class="btn-secondary" onclick="clearData()">清空数据</button>
                        <button class="btn-secondary" onclick="clearLogs()">清日志</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- EMG 通道 1-8（由 app.js 动态生成）-->
        <div class="row row-emg" id="row-emg-top"></div>
        <div class="row row-emg" id="row-emg-bottom"></div>

        <!-- IMU 传感器 -->
        <div class="row row-imu">
            <div class="panel imu-panel">
                <div class="panel-header">
                    <div class="panel-title imu-color"><span class="dot imu-dot"></span>IMU 传感器 (6通道)</div>
                    <div class="panel-actions">
                        <button class="btn-icon" onclick="openZoom('imu', 0)" title="放大">🔍</button>
                    </div>
                </div>
                <canvas id="canvas-imu"></canvas>
                <div class="data-grid imu-grid-vals" id="vals-imu"></div>
            </div>
        </div>

        <!-- 日志 -->
        <div class="row row-logs">
            <div class="panel panel-log">
                <div class="panel-header">
                    <span class="log-data-title">📥 实时接收数据</span>
                    <span class="log-count" id="data-log-count">0 条</span>
                </div>
                <div class="log-container" id="logData"></div>
            </div>
            <div class="panel panel-log">
                <div class="panel-header">
                    <span class="log-debug-title">🔧 调试信息</span>
                    <span class="log-count" id="debug-log-count">0 条</span>
                </div>
                <div class="log-container" id="logDebug"></div>
            </div>
        </div>
    </div>

    <script src="./scripts/app.js"></script>
</body>
</html>
